  <title>MiyonChat — QA 테스트 대상(SUT)</title>

</head>
<body>
  <!-- 화면은 전부 JS가 그립니다. 테스트는 data-testid로만 요소를 찾습니다. -->

  <!-- 디버그 콘솔은 화면 밖에 둡니다. 콘솔에서 상태를 바꿔도 화면은 그대로 남아 있어야
       "언제 갱신되는가"를 테스터가 직접 확인할 수 있습니다. -->
  <div id="debug"></div>

  <script src="js/data.js?v=26"></script>
  <script src="js/mock.js?v=26"></script>
  <script src="js/state.js?v=26"></script>
  <script src="js/screens.js?v=26"></script>

  <script src="js/app.js?v=26"></script>

</html>
