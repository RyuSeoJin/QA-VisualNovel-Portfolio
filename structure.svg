<svg class="sd" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 790" width="940" height="790" role="img" aria-labelledby="sdt sdd">
<title id="sdt">QA-VisualNovel-Portfolio 저장소 구조와 관계</title>
<desc id="sdd">절차 기준은 모든 작업에 적용되고, 형식 기준은 중앙 허브와 프로젝트 문서의 형식을 정하며, 생성 도구는 TC 엑셀을 만들어 냅니다. 프로젝트 산출물은 조사 전량(analysis)에서 채택분(reference)을 거쳐 확정 결정(spec)으로 좁혀지고, 레퍼런스에 없는 보강 결정도 spec으로 들어옵니다. 확정된 정본에서 TC 시트가 나오며, 테스트 대상을 직접 만드는 프로젝트는 sut과 automation을 더합니다. automation 안에서는 테스트가 돌아 결과가 쌓이고, 그 결과에서 리포트가 나오며, CI가 커버리지 대조·결함 주입 매트릭스·산출물 최신 여부를 반복 확인합니다.</desc>
<!--
  CHANGELOG
  v1.6 (2026-08-05) automation 구간 화살표 둘을 바로잡았다. automation→report는 상자
                    오른쪽 밖을 가리키고 있었고, sut→tests는 마지막 세로 구간이 화살표
                    머리보다 짧아 꼬리가 모서리에 얹혀 보였다. 둘 다 세로 구간을 12로
                    맞추고 상자 중앙에 꽂았다.
  v1.5 (2026-08-04) automation/ 안쪽을 tests·result·report로 펼치고 CI를 추가했다.
                    검증의 절반(테스트→결과→리포트→CI)이 그림에 통째로 없었다.
                    세부 판정 로직은 별도 그림으로 나눈다(diagrams/).
  v1.4 (2026-07-31) 생성 도구 → automation/ 화살표 추가(껍데기·리포트 생성).
                    test-case/를 관통하지 않도록 오른쪽 여백으로 우회시켰다.
  v1.3 (2026-07-31) 현재 폴더 구조에 맞춰 재작성 — qa-dictionary 추가,
                    'TC 생성 도구'를 '생성 도구'로 넓혀 tc-input-master 포함,
                    automation 내부 표기, archive·history 참조 규칙 각주.
  v1.2 (2026-07-31) spec/의 두 번째 입력(보강·ADD)을 추가. rules/에 자동화 규칙 포함 표기.
  v1.1 (2026-07-31) 프로젝트 산출물 행을 조사→채택→확정 파이프라인으로 재배치.
                    sut/·automation/을 조건부 행으로 분리.
  v1.0 (2026-07-31) 최초 수립. README·index.html 공용 구조도.

  이 파일이 정본이며 사본은 없다. 이 그림을 싣는 페이지의 생성기가 만들 때마다
  이 파일을 읽어 넣는다(intro/main-central-rules.html — gen_intro_html.py의 central 페이지).

  변환 없이 그대로 실리므로 root의 class="sd"와 id(sdt/sdd)는 바꾸지 않는다.
  색은 밝은 배경 기준이고, 다크 테마에서는 마스터 CSS가 클래스를 덮는다.
-->
