<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 650" width="940" height="650" role="img" aria-labelledby="t d">
<title id="t">QA-VisualNovel-Portfolio 저장소 구조와 관계</title>
<desc id="d">절차 기준은 모든 작업에 적용되고, 형식 기준은 중앙 허브와 프로젝트 문서의 형식을 정하며, TC 생성 도구는 테스트 케이스를 만들어 냅니다. 프로젝트 산출물은 조사 전량(analysis)에서 채택분(reference)을 거쳐 확정 결정(spec)으로 좁혀지고, 레퍼런스에 없는 보강 결정도 spec으로 들어옵니다. 확정된 정본에서 TC 시트가 나옵니다.</desc>
<!--
  CHANGELOG
  v1.2 (2026-07-31) spec/의 두 번째 입력(보강·ADD)을 추가. rules/에 자동화 규칙 포함 표기.
  v1.1 (2026-07-31) 프로젝트 산출물 행을 조사→채택→확정 파이프라인으로 재배치.
                    sut/·automation/을 조건부 행으로 분리.
  v1.0 (2026-07-31) 최초 수립. README·index.html 공용 구조도.

  README.md는 이 파일을 이미지로 참조하고, index.html은 같은 마크업을
  inline으로 품는다(자기완결 규칙). 수정 시 양쪽을 함께 갱신할 것.
  색은 밝은 배경 기준으로 인라인 지정되어 있고, index.html에서는
  클래스(grp/nd/t/s/pill/lbl/arrow)를 CSS로 덮어 다크 테마로 표시한다.
-->
